<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURORA · Dashboard</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  <style>
    /* ===== SALON THEME VARIABLES ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      transition: background-color 0.8s cubic-bezier(0.4, 0, 0.2, 1);
      min-height: 100vh;
      overflow-x: hidden;
      display: flex;
    }

    /* female theme (default) */
    body {
      --bg-primary: #f3e8e7;
      --bg-secondary: #eed5d2;
      --accent-1: #ecafb8;
      --accent-2: #b92c62;
      --pure-white: #ffffff;
      --text-primary: #2d1f2c;
      --text-secondary: #5c4b5a;
      --glow-primary: rgba(236, 175, 184, 0.6);
      --glow-secondary: rgba(185, 44, 98, 0.5);
      --neon-glow: 0 0 30px rgba(185, 44, 98, 0.3);
      --glass-bg: rgba(255, 255, 255, 0.25);
      --card-shadow: 0 30px 60px -15px rgba(185, 44, 98, 0.3);
      --gradient-1: linear-gradient(135deg, #f3e8e7, #ecafb8);
      --gradient-2: linear-gradient(45deg, #ecafb8, #b92c62);
    }

    /* Theme Toggle */
    .theme-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      z-index: 1100;
      background: var(--glass-bg);
      backdrop-filter: blur(10px);
      padding: 0.5rem;
      border-radius: 60px;
      border: 1px solid rgba(255,255,255,0.2);
      display: flex;
      gap: 0.5rem;
    }
    .theme-icon {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
      transition: all 0.3s ease;
      color: var(--text-primary);
      border: 2px solid var(--accent-2);
    }
    .theme-icon.active {
      background: var(--accent-2);
      color: white;
      box-shadow: var(--neon-glow);
    }

    /* Sidebar Styles */
    .sidebar {
      width: 280px;
      height: 100vh;
      background: var(--glass-bg);
      backdrop-filter: blur(15px) saturate(160%);
      -webkit-backdrop-filter: blur(15px) saturate(160%);
      border-right: 2px solid rgba(255,255,255,0.2);
      position: fixed;
      top: 0;
      left: 0;
      display: flex;
      flex-direction: column;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 1000;
      box-shadow: 5px 0 20px rgba(0,0,0,0.05);
    }

    .sidebar.collapsed {
      width: 80px;
    }

    .sidebar-header {
      padding: 2rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255,255,255,0.2);
    }

    .logo-text {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      font-size: 1.5rem;
      background: var(--gradient-2);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 1px;
      transition: opacity 0.3s;
      white-space: nowrap;
    }

    .sidebar.collapsed .logo-text {
      opacity: 0;
      pointer-events: none;
      display: none;
    }

    .toggle-btn {
      background: transparent;
      border: none;
      color: var(--text-primary);
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s;
    }

    .sidebar.collapsed .sidebar-header {
      justify-content: center;
    }

    .nav-links {
      list-style: none;
      padding: 2rem 0;
      flex: 1;
    }

    .nav-item {
      padding: 0.8rem 1.5rem;
      margin: 0.5rem 1rem;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      color: var(--text-primary);
      text-decoration: none;
      transition: all 0.3s;
      font-weight: 600;
    }

    .sidebar.collapsed .nav-item {
      justify-content: center;
      padding: 0.8rem;
    }

    .nav-item i {
      font-size: 1.3rem;
      color: var(--accent-2);
      min-width: 30px;
      text-align: center;
    }

    .nav-text {
      margin-left: 1rem;
      white-space: nowrap;
      transition: opacity 0.3s;
    }

    .sidebar.collapsed .nav-text {
      opacity: 0;
      display: none;
    }

    .nav-item:hover, .nav-item.active {
      background: var(--accent-2);
      color: white;
      box-shadow: var(--neon-glow);
    }
    .nav-item:hover i, .nav-item.active i {
      color: white;
    }

    /* Main Content */
    .main-content {
      margin-left: 280px;
      padding: 3rem;
      flex: 1;
      transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      width: 100%;
    }

    .sidebar.collapsed ~ .main-content {
      margin-left: 80px;
    }

    .page-header {
      margin-bottom: 3rem;
    }

    .page-header h1 {
      font-family: 'Syncopate', sans-serif;
      font-weight: 700;
      color: var(--text-primary);
    }

    .page-header p {
      color: var(--text-secondary);
      font-size: 1.1rem;
    }

    /* Glassmorphic Card */
    .glass-card {
      background: var(--glass-bg);
      backdrop-filter: blur(15px) saturate(160%);
      -webkit-backdrop-filter: blur(15px) saturate(160%);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 2rem;
      padding: 2.5rem;
      box-shadow: 0 40px 70px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.3);
      animation: floatIn 0.8s ease forwards;
      max-width: 800px;
    }

    @keyframes floatIn {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    .user-info-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 2rem;
      margin-top: 1rem;
    }

    .info-group {
      display: flex;
      flex-direction: column;
    }

    .info-label {
      font-size: 0.9rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 0.5rem;
      font-weight: 600;
    }

    .info-value {
      font-size: 1.2rem;
      color: var(--text-primary);
      font-weight: 600;
      padding: 0.8rem 1rem;
      background: rgba(255,255,255,0.4);
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.5);
    }

    .role-badge {
      display: inline-block;
      padding: 0.5rem 1.5rem;
      border-radius: 30px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      box-shadow: var(--neon-glow);
    }

  </style>
</head>
<body>

  <!-- Theme Toggle -->
  <div class="theme-toggle">
    <div class="theme-icon active" id="femaleIcon"><i class="bi bi-venus"></i></div>
    <div class="theme-icon" id="maleIcon"><i class="bi bi-mars"></i></div>
  </div>

  <!-- Sidebar -->
  <nav class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo-text">AURORA</div>
      <button class="toggle-btn" id="toggleBtn">
        <i class="bi bi-list"></i>
      </button>
    </div>
    
    <ul class="nav-links">
      <a href="#" class="nav-item active">
        <i class="bi bi-grid-1x2"></i>
        <span class="nav-text">Dashboard</span>
      </a>
      <a href="#" class="nav-item">
        <i class="bi bi-calendar-check"></i>
        <span class="nav-text">Appointments</span>
      </a>
      <a href="#" class="nav-item">
        <i class="bi bi-scissors"></i>
        <span class="nav-text">Services</span>
      </a>
      <a href="#" class="nav-item">
        <i class="bi bi-person-badge"></i>
        <span class="nav-text">Profile</span>
      </a>
      <a href="#" class="nav-item">
        <i class="bi bi-gear"></i>
        <span class="nav-text">Settings</span>
      </a>
    </ul>

    <ul class="nav-links" style="flex: 0; padding-bottom: 1rem;">
      <a href="#" class="nav-item" id="logoutBtn">
        <i class="bi bi-box-arrow-left"></i>
        <span class="nav-text">Logout</span>
      </a>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="main-content">
    <div class="page-header">
      <h1>Dashboard</h1>
      <p>Welcome back to your beauty portal</p>
    </div>

    <div class="glass-card" id="userInfoCard">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 style="font-family: 'Syncopate', sans-serif; font-weight: 700; color: var(--accent-2);">Your Profile</h3>
        <div id="roleBadgeContainer"></div>
      </div>
      
      <div class="user-info-grid" id="userInfoGrid">
        <p>Loading user data...</p>
      </div>
    </div>
  </main>

  <script>
    // ========== THEME TOGGLE ==========
    const femaleIcon = document.getElementById('femaleIcon');
    const maleIcon = document.getElementById('maleIcon');
    const body = document.body;

    function setTheme(theme) {
      if (theme === 'female') {
        body.style.setProperty('--bg-primary', '#f3e8e7');
        body.style.setProperty('--accent-2', '#b92c62');
        body.style.setProperty('--gradient-2', 'linear-gradient(45deg, #ecafb8, #b92c62)');
        body.style.setProperty('--text-primary', '#2d1f2c');
        body.style.setProperty('--text-secondary', '#5c4b5a');
        femaleIcon.classList.add('active');
        maleIcon.classList.remove('active');
      } else {
        body.style.setProperty('--bg-primary', '#030514');
        body.style.setProperty('--accent-2', '#7a2eff');
        body.style.setProperty('--gradient-2', 'linear-gradient(45deg, #00d0ff, #7a2eff)');
        body.style.setProperty('--text-primary', '#ffffff');
        body.style.setProperty('--text-secondary', '#a0b8d4');
        maleIcon.classList.add('active');
        femaleIcon.classList.remove('active');
      }
    }

    femaleIcon.addEventListener('click', () => setTheme('female'));
    maleIcon.addEventListener('click', () => setTheme('male'));

    // ========== SIDEBAR TOGGLE ==========
    const sidebar = document.getElementById('sidebar');
    const toggleBtn = document.getElementById('toggleBtn');
    
    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    // ========== USER DATA LOAD ==========
    document.addEventListener('DOMContentLoaded', () => {
        const userStr = localStorage.getItem('user');
        
        if (!userStr) {
            window.location.href = 'signIn.html';
            return;
        }
        
        try {
            const user = JSON.parse(userStr);
            const gridEl = document.getElementById('userInfoGrid');
            const roleContainer = document.getElementById('roleBadgeContainer');
            
            let roleStr = 'CUSTOMER';
            if(user.userTypeId === 3) roleStr = 'ADMIN';
            if(user.userTypeId === 2) roleStr = 'STYLIST';
            
            let roleColor = '#b92c62'; // default accent
            if(roleStr === 'ADMIN') roleColor = '#ef4444';
            if(roleStr === 'STYLIST') roleColor = '#7a2eff';
            
            // Set Badge
            roleContainer.innerHTML = `<span class="role-badge" style="background: ${roleColor}; color: white;">${roleStr}</span>`;
            
            // Set Grid
            gridEl.innerHTML = `
                <div class="info-group">
                  <span class="info-label">Full Name</span>
                  <span class="info-value">${user.firstName} ${user.lastName}</span>
                </div>
                <div class="info-group">
                  <span class="info-label">Email Address</span>
                  <span class="info-value">${user.email}</span>
                </div>
                <div class="info-group">
                  <span class="info-label">Mobile Number</span>
                  <span class="info-value">${user.mobile || 'Not Provided'}</span>
                </div>
            `;
        } catch (e) {
            localStorage.removeItem('user');
            window.location.href = 'signIn.html';
        }
    });

    // ========== LOGOUT ==========
    document.getElementById('logoutBtn').addEventListener('click', async (e) => {
        e.preventDefault();
        try {
            await fetch('/api/users/logout', { method: 'POST' });
        } catch(err) {}
        localStorage.removeItem('user');
        window.location.href = 'signIn.html';
    });
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
